name: Compact layout evidence

on:
  workflow_dispatch:
  push:
    branches: [fix-fold-stop-time]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare isolated device build
        run: |
          chmod +x gradlew
          cat > "$RUNNER_TEMP/layout-check.gradle" <<'EOF'
          gradle.beforeProject { p ->
              p.plugins.withId("com.android.application") {
                  p.extensions.getByName("androidComponents").finalizeDsl { android ->
                      android.defaultConfig.applicationId = "info.anodsplace.evtimer.layoutcheck"
                  }
              }
          }
          EOF
      - name: Capture baseline and prove the regressions fail
        run: |
          source=shared/src/commonMain/kotlin/info/anodsplace/evtimer/ui/RunningTimerScreen.kt
          cp "$source" "$RUNNER_TEMP/RunningTimerScreen.kt"
          trap 'cp "$RUNNER_TEMP/RunningTimerScreen.kt" "$source"' EXIT
          git show ba9d879:"$source" > "$source"
          ./gradlew :androidApp:assembleDebug --no-configuration-cache -I "$RUNNER_TEMP/layout-check.gradle"
          mkdir -p evidence/before
          cp androidApp/build/outputs/apk/debug/*.apk evidence/before/
          set +e
          ./gradlew :shared:jvmTest --tests '*RunningCompactLayoutTest*'
          result=$?
          set -e
          test "$result" -ne 0
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("shared/build/test-results/jvmTest/TEST-info.anodsplace.evtimer.ui.RunningCompactLayoutTest.xml").getroot()
          assert int(root.attrib["failures"]) > 0 and int(root.attrib["errors"]) == 0
          assert any(case.attrib["name"].removesuffix("()") == "statValueMovesBelowItsLabelInsteadOfBeingSqueezed" and case.find("failure") is not None for case in root.findall("testcase"))
          PY
          cp -r shared/build/reports/running-layout evidence/before/
          cp shared/build/test-results/jvmTest/TEST-*RunningCompactLayoutTest.xml evidence/before/
          cp "$RUNNER_TEMP/RunningTimerScreen.kt" "$source"
          trap - EXIT
      - name: Verify fixed layout and build isolated APK
        run: |
          ./gradlew :shared:jvmTest --tests '*RunningCompactLayoutTest*' --tests '*RunningCompletionScreenTest*' --tests '*RunningSpeedRowTest*' --tests '*TimePredictionBarTest*' --tests '*LocalizationFormattingTest*'
          ./gradlew :androidApp:assembleDebug --no-configuration-cache -I "$RUNNER_TEMP/layout-check.gradle"
          mkdir -p evidence/after
          cp androidApp/build/outputs/apk/debug/*.apk evidence/after/
          cp -r shared/build/reports/running-layout evidence/after/
          cp shared/build/test-results/jvmTest/TEST-*.xml evidence/after/
          git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compact-layout-evidence
          path: |
            evidence/
            shared/build/test-results/jvmTest/
            shared/build/reports/running-layout/
          if-no-files-found: error
