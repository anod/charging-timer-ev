name: Build isolated charging power review APK

on:
  push:
    branches: [anod-settings-charging-power-device]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Build isolated APK
        run: |
          cat > "$RUNNER_TEMP/isolated.gradle" <<'EOF'
          gradle.beforeProject { p -> p.plugins.withId("com.android.application") { p.extensions.getByName("androidComponents").finalizeDsl { android -> android.defaultConfig.applicationId = "info.anodsplace.evtimer.powercheck" } } }
          EOF
          ./gradlew :androidApp:assembleDebug --no-configuration-cache -I "$RUNNER_TEMP/isolated.gradle"
      - uses: actions/upload-artifact@v7
        with:
          name: isolated-power-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
