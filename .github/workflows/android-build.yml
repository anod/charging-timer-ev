name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check for hardcoded UI strings
        run: python3 scripts/check_hardcoded_ui_strings.py

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Verify storage, host tests and Android backup rules
        run: ./gradlew :shared:jvmTest :shared:testAndroidHostTest :shared:verifyCommonMainChargingDatabaseMigration :androidApp:testDebugUnitTest :androidApp:lintDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
