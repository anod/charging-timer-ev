name: Build Wasm web shell

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - ".github/workflows/wasm-shell-build.yml"
      - "webApp/**"
      - "shared/**"
      - "lib/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Wasm web shell
        run: ./gradlew :webApp:wasmJsBrowserDistribution
