name: Build Wasm web shell

on:
  pull_request:
    branches: [ "**" ]
    paths:
      - ".github/workflows/wasm-shell-build.yml"
      - "webApp/**"
      - "shared/**"
      - "storage/**"
      - "database/**"
      - "lib/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Test IndexedDB transactions
        working-directory: webApp
        run: npm ci --ignore-scripts && npm test

      - name: Test portable backup and browser state
        run: ./gradlew :storage:jvmTest :shared:jvmTest --tests '*ManualBackupTest' --tests '*BrowserStorageTest' --tests '*BackupCompatibilityTest' --tests '*BrowserTimerRuntimeTest' --tests '*BrowserNotificationsTest' --tests '*ChargingCalculatorTest' --tests '*ChargingServiceTest' --tests '*ChargingViewModelTest' --tests '*TimeProgressTest'

      - name: Build Wasm web shell
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Verify real browser persistence and capture light/dark UI
        working-directory: webApp
        run: npx playwright install --with-deps chromium && npm run test:browser

      - name: Verify production PWA offline and safe updates
        working-directory: webApp
        run: npm run test:pwa

      - name: Upload browser build and evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-storage-evidence
          path: |
            webApp/build/dist/wasmJs/productionExecutable
            webApp/build/browser-evidence
            storage/build/test-results
            shared/build/test-results
            webApp/package-lock.json
