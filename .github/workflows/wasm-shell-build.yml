name: Build and deploy PWA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "**" ]
    paths:
      - ".github/workflows/wasm-shell-build.yml"
      - "docs/privacy.md"
      - "docs/web-app.md"
      - "webApp/**"
      - "shared/**"
      - "storage/**"
      - "database/**"
      - "lib/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Record checkout SHA
        run: git log -1 --format=%H

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Test IndexedDB transactions
        working-directory: webApp
        run: npm ci --ignore-scripts && npm test

      - name: Check for hardcoded UI strings
        run: python3 scripts/check_hardcoded_ui_strings.py

      - name: Test portable backup and browser state
        run: ./gradlew :storage:jvmTest :shared:jvmTest --tests '*ManualBackupTest' --tests '*BrowserStorageTest' --tests '*BackupCompatibilityTest' --tests '*BrowserTimerRuntimeTest' --tests '*BrowserNotificationsTest' --tests '*AppNavigationStateTest' --tests '*ChargingCalculatorTest' --tests '*ChargingServiceTest' --tests '*ChargingViewModelTest' --tests '*TimeProgressTest'

      - name: Build Wasm web shell
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Package complete Pages site and privacy policy
        working-directory: webApp
        run: npm run package:pages

      - name: Verify real browser persistence and capture light/dark UI
        working-directory: webApp
        run: npx playwright install --with-deps chromium && npm run test:browser

      - name: Verify exact Pages site in Chromium at project path
        working-directory: webApp
        timeout-minutes: 5
        run: npm run test:pwa -- build/pages

      - name: Upload verified Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: webApp/build/pages

      - name: Upload browser build and evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-storage-evidence
          path: |
            webApp/build/dist/wasmJs/productionExecutable
            webApp/build/browser-evidence
            storage/build/test-results
            shared/build/test-results
            webApp/package-lock.json

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages-deployment
      cancel-in-progress: false
    steps:
      - name: Deploy verified site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
