koin = "4.2.2"
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"
material3 = "1.12.0-alpha03"
navigation3 = "1.2.0"
splashscreen = "1.2.0"
sqldelight = "2.4.1"

[libraries]
